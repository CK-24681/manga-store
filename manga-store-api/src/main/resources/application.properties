# ─────────────────────────────────────────────
# Mangazon API — Spring Boot Configuration
# ─────────────────────────────────────────────

# Server port (default: 8080)
server.port=8080

# Application name
spring.application.name=manga-store-api

# Jackson: camelCase serialization, non-null only
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.indent-output=false

# ─────────────────────────────────────────────
# MangaDex API Integration
# ─────────────────────────────────────────────
# Set to false to always use mock data (useful for offline development)
# NOTE: This property is currently reserved for future use and not yet consumed by the application.
mangadex.enabled=true
# Request timeout in milliseconds
mangadex.timeout=10000

# ─────────────────────────────────────────────
# Actuator
# ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.com.mangazon=INFO
logging.level.org.springframework.web=WARN
logging.level.com.mangazon.api.data.MangaDexService=DEBUG
